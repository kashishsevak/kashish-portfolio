<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kashish Sevak — MERN Stack Developer portfolio. Projects, skills and contact details." />
    <meta name="theme-color" content="#0d0b1a" />
    <title>Kashish Sevak — MERN Stack Developer</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ks-theme");
          var theme = saved === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
